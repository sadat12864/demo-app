name: Build and Push to Amazon ECR

on:
  push:
    branches:
      - main
      - DEV
    paths:
      - "demo-app/**"
      - "Dockerfile"
      - "requirements.txt"

env:
  IMAGE_TAG: ${{ github.sha }}
  GITOPS_BRANCH: ${{ github.ref_name }}
  GITOPS_REPO: demo-app-gitops

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .

      - name: Tag Docker Image
        run: |
          docker tag \
          ${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
          ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Push Docker Image
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Clone GitOps Repository
        run: |
          git clone \
            --branch "$GITOPS_BRANCH" \
            https://x-access-token:${{ secrets.GITOPS_PAT }}@github.com/${{ github.repository_owner }}/$GITOPS_REPO.git

      - name: Verify GitOps Repository
        run: |
          pwd
          ls -la
          ls -la demo-app-gitops

      - name: Go to GitOps Repository
        working-directory: ${{ env.GITOPS_REPO }}
        run: |
          pwd
          ls

      - name: Update deployment.yaml
        working-directory: ${{ env.GITOPS_REPO }}
        run: |
          echo "Before update:"
          grep -n "image:" deployment.yaml
          sed -i "s|^[[:space:]]*image:.*|        image: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:$IMAGE_TAG|" deployment.yaml
          echo "After update:"
          grep -n "image:" deployment.yaml

      - name: Show Git Status
        working-directory: ${{ env.GITOPS_REPO }}
        run: |
          git status

      - name: Commit and Push GitOps Changes
        working-directory: ${{ env.GITOPS_REPO }}
        run: |
          git add deployment.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "ci(gitops): update image to $IMAGE_TAG"
          git push origin HEAD:"$GITOPS_BRANCH"

      - name: Verify Push
        working-directory: ${{ env.GITOPS_REPO }}
        run: |
          git log --oneline origin/"$GITOPS_BRANCH" -1


