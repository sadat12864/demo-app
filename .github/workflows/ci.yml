name: Build and Push to Amazon ECR

on:
  push:
    branches:
      - main
      - DEV

env:
  IMAGE_TAG: ${{ github.sha }}
  GITOPS_BRANCH: ${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}::role/GitHubActionsRole
          aws-region: us-east-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .

      - name: Tag Docker Image
        run: |
          docker tag \
          ${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
          ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Push Docker Image
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Clone GitOps Repository
        run: |
          git clone \
            --branch "$GITOPS_BRANCH" \
            https://x-access-token:${{ secrets.GITOPS_PAT }}@github.com/${{ github.repository_owner }}/demo-app-gitops.git

      - name: Verify GitOps Repository
        run: |
          pwd
          ls -la
          ls -la demo-app-gitops

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          
      - name: Go to GitOps Repository
        run: |
          cd demo-app-gitops
          pwd
          ls

      - name: Update deployment.yaml
        run: |
          cd demo-app-gitops
          echo "Before update:"
          grep -n "image:" deployment.yaml
          sed -i "s|image:.*|        image: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:$IMAGE_TAG|g" deployment.yaml
          echo "After update:"
          grep -n "image:" deployment.yaml


